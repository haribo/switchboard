<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>switchboard</title>
<style>
  :root {
    color-scheme: light dark;
    --ground: #f6f7f6; --surface: #ffffff; --line: #e0e5e2; --ink: #15201c;
    --muted: #5d6a65; --accent: #2f5d50; --wait: #8c5e0d; --stop: #a1382a;
    --live: #2f6a4a; --shade: #f1f3f1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #191d1f; --surface: #1d2123; --line: #2f3538; --ink: #e7e6e2;
      --muted: #98a09c; --accent: #7fb8a5; --wait: #d8a44e; --stop: #e08272;
      --live: #79c39a; --shade: #22272a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .bar {
    display: flex; align-items: baseline; gap: 14px; padding: 16px 24px;
    border-bottom: 1px solid var(--line); background: var(--surface);
  }
  .bar .mark { font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
  .bar .sync { margin-left: auto; font-size: 12px; color: var(--muted); }
  .bar .sync.down { color: var(--stop); font-weight: 600; }
  main { max-width: 1000px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; }
  section + section { margin-top: 34px; }

  .sec-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .sec-head h2 {
    margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted);
  }
  .sec-head .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* --- sessions table --- */
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); }
  thead th {
    text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .09em;
    text-transform: uppercase; color: var(--muted); padding: 10px 14px;
    border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  tbody td {
    padding: 11px 14px; border-bottom: 1px solid var(--line);
    vertical-align: baseline; font-size: 14.5px;
  }
  tbody tr:last-child td { border-bottom: 0; }
  .c-dev { font-weight: 600; white-space: nowrap; }
  .c-state { width: 1%; text-align: center; }
  .c-issue { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .c-issue a { color: var(--accent); text-underline-offset: 2px; }
  .c-issue .none { color: var(--muted); }
  /* One line, clipped: every row keeps the same height, so the table stays
     scannable however long a session's note runs. */
  .c-note {
    color: var(--muted); max-width: 1px; width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .c-for {
    font-size: 13px; color: var(--muted); text-align: right;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  /* Only when there is something to say: a fleet that is all healthy shows
     nothing here, which is this page's whole discipline. */
  .c-for .quiet { color: var(--wait); font-weight: 600; }
  .c-for .quiet::before { content: "·"; margin: 0 6px; color: var(--muted); font-weight: 400; }

  .ico { width: 19px; height: 19px; display: block; fill: currentColor; }
  .c-state .ico { margin: 0 auto; }
  .c-note .paused { color: var(--ink); font-weight: 600; }
  .st-blocked { color: var(--stop); }
  .st-waiting_on_you { color: var(--wait); }
  /* Paused on a peer, not on the reader: it needs nothing from the PO, so it is
     marked without the amber that means "you". */
  .st-waiting_on_peer { color: var(--muted); }
  .st-working { color: var(--live); }
  .st-idle { color: var(--muted); }

  .legend {
    display: flex; flex-wrap: wrap; gap: 6px 20px; padding: 10px 14px 0;
    font-size: 12.5px; color: var(--muted);
  }
  .legend[hidden] { display: none; }
  td.nothing { color: var(--muted); padding: 18px 14px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }

  /* --- asks --- */
  .asks { display: flex; flex-direction: column; gap: 14px; }
  .ask {
    background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--accent); border-radius: 3px; padding: 16px 18px;
  }
  .ask.validation { border-left-color: var(--wait); }
  .ask.blocked { border-left-color: var(--stop); }
  .ask.done { border-left-color: var(--muted); background: var(--shade); }

  .ask-head {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-size: 12.5px; color: var(--muted); margin-bottom: 10px;
  }
  .role {
    font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 2px; color: var(--surface); background: var(--accent);
  }
  .role.manager { background: var(--ink); }
  .who { color: var(--ink); font-weight: 600; }
  .ask-head a { color: var(--accent); }
  .ask-head .sep { opacity: .45; }
  .ask-head .kind {
    margin-left: auto; letter-spacing: .06em; text-transform: uppercase; font-size: 11px;
  }

  .ask h3 {
    margin: 0 0 6px; font-size: 17px; font-weight: 600; letter-spacing: -.012em;
    text-wrap: balance; line-height: 1.3;
  }
  .desc { margin: 0 0 14px; font-size: 14.5px; color: var(--muted); max-width: 68ch; }
  .desc :first-child { margin-top: 0; }
  .desc :last-child { margin-bottom: 0; }
  .desc a { color: var(--accent); text-underline-offset: 2px; word-break: break-word; }
  .desc code {
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: .88em;
    background: var(--shade); padding: 1px 5px; border-radius: 2px; color: var(--ink);
  }
  .desc ul, .desc ol { margin: 8px 0; padding-left: 20px; }
  .open-link { display: inline-block; margin-bottom: 14px; font-weight: 600; color: var(--accent); }

  /* The plain-words version, beside the original — never in place of it. */
  .plain {
    border-left: 2px solid var(--accent); background: var(--shade);
    padding: 10px 14px; margin: 0 0 14px; border-radius: 0 3px 3px 0;
  }
  .plain .lead {
    font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 4px;
  }
  .plain .desc { margin: 0; color: var(--ink); }
  .asked { font-size: 13px; color: var(--muted); margin: 12px 0 0; }
  /* Secondary to answering: quieter, and out of the row of answers. */
  button.aside {
    margin-top: 12px; padding: 4px 10px; font-size: 13px;
    color: var(--muted); border-color: transparent; background: transparent;
  }
  button.aside:hover:not(:disabled) { color: var(--accent); border-color: var(--line); }

  .choices { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  button {
    font: inherit; font-size: 14.5px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 3px; padding: 7px 15px;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .55; cursor: default; }
  button.send {
    background: var(--accent); border-color: var(--accent); font-weight: 600; color: var(--ground);
  }
  button.send:hover:not(:disabled) {
    color: var(--ground); background: color-mix(in srgb, var(--accent) 84%, var(--ink));
  }
  .free { display: flex; gap: 8px; }
  .free input {
    flex: 1; min-width: 0; font: inherit; font-size: 14.5px; padding: 8px 11px;
    border: 1px solid var(--line); border-radius: 3px; background: var(--ground); color: var(--ink);
  }
  .free input::placeholder { color: var(--muted); }
  .free input:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }

  .verdict { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .verdict .given { font-weight: 600; font-size: 15px; }
  .verdict .left { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .note { margin: 10px 0 0; font-size: 13px; color: var(--stop); }
  .empty { color: var(--muted); }

  .foot {
    margin-top: 28px; padding-top: 10px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap;
  }
  .foot .warn { color: var(--stop); font-weight: 600; }

  .fold { border-top: 1px solid var(--line); margin-top: 34px; padding-top: 12px; }
  .fold summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .fold ul { margin: 12px 0 0; padding-left: 20px; color: var(--muted); font-size: 14px; }
  .fold li { margin-bottom: 6px; }

  @media (max-width: 620px) { .ask-head .kind { margin-left: 0; } }
</style>
</head>
<body>
<!-- Material Symbols (Apache 2.0), inlined: the service must work with no
     network, and an icon that silently falls back to its own name is worse
     than no icon. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-blocked" viewBox="0 -960 960 960"><path d="M324-111.5Q251-143 197-197t-85.5-127Q80-397 80-480t31.5-156Q143-709 197-763t127-85.5Q397-880 480-880t156 31.5Q709-817 763-763t85.5 127Q880-563 880-480t-31.5 156Q817-251 763-197t-127 85.5Q563-80 480-80t-156-31.5ZM480-160q54 0 104-17.5t92-50.5L228-676q-33 42-50.5 92T160-480q0 134 93 227t227 93Zm252-124q33-42 50.5-92T800-480q0-134-93-227t-227-93q-54 0-104 17.5T284-732l448 448ZM480-480Z"/></symbol>
  <symbol id="i-waiting_on_you" viewBox="0 -960 960 960"><path d="M512-40q-82 0-154-37.5T240-182L48-464l19-19q20-21 49.5-24t53.5 14l110 76v-383q0-17 11.5-28.5T320-840q17 0 28.5 11.5T360-800v537L212-366l95 138q35 51 89 79.5T512-120q103 0 175.5-72.5T760-368v-392q0-17 11.5-28.5T800-800q17 0 28.5 11.5T840-760v392q0 137-95.5 232.5T512-40Zm-72-440v-400q0-17 11.5-28.5T480-920q17 0 28.5 11.5T520-880v400h-80Zm160 0v-360q0-17 11.5-28.5T640-880q17 0 28.5 11.5T680-840v360h-80ZM486-300Z"/></symbol>
  <symbol id="i-waiting_on_peer" viewBox="0 -960 960 960"><path d="M320-160h320v-120q0-66-47-113t-113-47q-66 0-113 47t-47 113v120ZM160-80v-80h80v-120q0-61 28.5-114.5T348-480q-51-32-79.5-85.5T240-680v-120h-80v-80h640v80h-80v120q0 61-28.5 114.5T612-480q51 32 79.5 85.5T720-280v120h80v80H160Z"/></symbol>

<div class="bar">
  <span class="mark">switchboard</span>
  <span class="sync" id="sync">…</span>
</div>

<main>
  <section>
    <div class="sec-head">
      <h2>Sessions</h2>
      <span class="count" id="session-count"></span>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th scope="col">Dev</th>
            <th scope="col">State</th>
            <th scope="col">Issue</th>
            <th scope="col">What's happening</th>
            <th scope="col" style="text-align:right">For</th>
          </tr>
        </thead>
        <tbody id="sessions"></tbody>
      </table>
    </div>
    <div class="legend" id="legend">
      <span><svg class="ico st-blocked"><use href="#i-blocked"/></svg> blocked</span>
      <span><svg class="ico st-waiting_on_you"><use href="#i-waiting_on_you"/></svg> waiting on you</span>
      <span><svg class="ico st-waiting_on_peer"><use href="#i-waiting_on_peer"/></svg> waiting on another session</span>
      <span><svg class="ico st-working"><use href="#i-working"/></svg> working</span>
      <span><svg class="ico st-idle"><use href="#i-idle"/></svg> idle</span>
    </div>
  </section>

  <section>
    <div class="sec-head">
      <h2>Your call</h2>
      <span class="count" id="count"></span>
    </div>
    <div class="asks" id="asks"></div>
    <p class="empty" id="empty" hidden>Nothing is waiting on you.</p>
  </section>

  <details class="fold" id="infos-box">
    <summary id="infos-summary">Info</summary>
    <ul id="infos"></ul>
  </details>

  <div class="foot" id="foot"></div>
</main>

<script>
"use strict";

// The page must never move under the PO: cards are built once and never
// re-rendered, the order is the server's, and nothing animates.
const cards = new Map();       // event id -> card element
const undoable = new Map();    // event id -> { el, until } while it can be taken back
const rows = new Map();        // session name -> row element
const STATES = ["blocked", "waiting_on_you", "waiting_on_peer", "working", "idle"];
const LABEL = {
  blocked: "blocked", waiting_on_you: "waiting on you",
  waiting_on_peer: "waiting on another session",
  working: "working", idle: "idle",
};
let undoWindow = 10;           // seconds; the server sends the real value

function forHuman(iso) {
  const mins = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins} min`;
  const h = Math.floor(mins / 60), m = mins % 60;
  return m ? `${h}h${String(m).padStart(2, "0")}` : `${h}h`;
}

// "just now ago" is not English. Anything else takes the suffix.
function ago(iso) {
  const when = forHuman(iso);
  return when === "just now" ? when : when + " ago";
}

// The role tag already says "manager"; repeating it as a name says nothing.
function nameBeside(role, author) {
  return author === role ? "" : author;
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

// issueNode renders an issue as a link when the service could resolve one, and
// as plain text otherwise: a link that leads nowhere is worse than no link.
function issueNode(o, blank) {
  if (!o.issue) return blank;
  const label = o.issue_label || ("#" + o.issue);
  if (!o.issue_url) return document.createTextNode(label);
  const a = el("a", null, label);
  a.href = o.issue_url;
  a.target = "_blank";
  a.rel = "noreferrer";
  return a;
}

function icon(state) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "ico st-" + state);
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", LABEL[state] || state);
  const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
  use.setAttribute("href", "#i-" + state);
  svg.append(use);
  return svg;
}

// The tab is the only thing allowed to call out: a count in the title and a
// colour in the favicon. Nothing pops, nothing sounds, nothing steals focus.
let shownCount = -1;
function setTab(n) {
  if (n === shownCount) return;
  shownCount = n;
  document.title = n ? `(${n}) switchboard` : "switchboard";
  const svg =
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">` +
    `<rect width="32" height="32" rx="8" fill="${n ? "#d8a44e" : "#6b6762"}"/>` +
    (n ? `<text x="16" y="24" text-anchor="middle" fill="#1d1c1a"` +
         ` font-family="system-ui,sans-serif" font-size="22" font-weight="700"` +
         `>${n > 9 ? "+" : n}</text>` : "") +
    `</svg>`;
  let link = document.querySelector("link[rel=icon]");
  if (!link) {
    link = document.createElement("link");
    link.rel = "icon";
    document.head.append(link);
  }
  link.href = "data:image/svg+xml," + encodeURIComponent(svg);
}

// --- sessions ---------------------------------------------------------------

function renderSessions(sessions) {
  const body = document.getElementById("sessions");
  document.getElementById("session-count").textContent = sessions.length;
  // Before any session has reported, an empty table body reads as a bug. Say
  // what is missing, and hide the legend for icons that are not on screen.
  document.getElementById("legend").hidden = sessions.length === 0;
  if (sessions.length === 0) {
    rows.clear();
    const row = el("tr");
    const cell = el("td", "nothing",
      "No session has reported yet. One appears here as soon as a dev runs switchboard state.");
    cell.colSpan = 5;
    row.append(cell);
    body.replaceChildren(row);
    return;
  }
  if (body.querySelector(".nothing")) body.replaceChildren();
  const seen = new Set();

  for (const s of sessions) {
    seen.add(s.name);
    let row = rows.get(s.name);
    if (!row) {
      row = el("tr");
      row.append(el("td", "c-dev"), el("td", "c-state"), el("td", "c-issue"),
                 el("td", "c-note"), el("td", "c-for"));
      rows.set(s.name, row);
      body.append(row);
    }
    const [dev, state, issue, note, since] = row.children;
    dev.textContent = s.name;
    state.replaceChildren(icon(STATES.includes(s.state) ? s.state : "working"));

    issue.replaceChildren(issueNode(s, el("span", "none", "—")));

    if (s.waiting_on) {
      // Which session, and on what — the detail alone had to say this by hand,
      // in capitals, and the state column contradicted it.
      note.replaceChildren(el("span", "paused", `waiting on ${s.waiting_on}`));
      if (s.waiting_for_label) {
        const ref = issueNode(
          { issue: s.waiting_for_label, issue_label: s.waiting_for_label, issue_url: s.waiting_for_url }, null);
        if (ref) note.append(document.createTextNode(" "), ref);
      }
      if (s.detail) note.append(document.createTextNode(" — " + s.detail));
      note.title = `Paused on ${s.waiting_on}. ` + (s.detail || "");
    } else {
      note.textContent = s.detail || "";
      note.title = s.detail || "";
    }

    // Two readings, both needed: how long it has been on this, and whether
    // anything is still arriving. A session declaring every minute and one that
    // stopped an hour ago have the same since_at.
    since.replaceChildren(document.createTextNode(forHuman(s.since_at)));
    if (s.quiet) {
      const q = el("span", "quiet", "quiet " + forHuman(s.updated_at));
      // Says what was observed — silence — not what might be behind it.
      q.title = "Nothing has arrived from this session since " +
        new Date(s.updated_at).toLocaleTimeString() +
        ". It may be on one long task, or gone — the service cannot tell.";
      since.append(q);
    }
  }

  for (const [name, row] of rows) {
    if (!seen.has(name)) { row.remove(); rows.delete(name); }
  }
  // Always by name: every dev keeps the same line all day, so you learn where
  // to look instead of reading. Nothing ever jumps.
  [...rows.keys()].sort().forEach(n => body.append(rows.get(n)));
}

// --- what is waiting on the PO ----------------------------------------------

function buildCard(e) {
  const card = el("article", "ask " + e.kind);
  card.dataset.id = e.id;

  const head = el("div", "ask-head");
  head.append(el("span", "role" + (e.role === "manager" ? " manager" : ""), e.role || "dev"));
  const name = nameBeside(e.role, e.author);
  if (name) head.append(el("span", "who", name));
  if (e.issue) {
    head.append(el("span", "sep", "·"), issueNode(e, null));
  }
  head.append(el("span", "sep", "·"), el("span", null, ago(e.created_at)));
  head.append(el("span", "kind", e.kind));
  card.append(head, el("h3", null, e.title));

  if (e.body) {
    const desc = el("div", "desc");
    // Sanitized server-side against a short whitelist; see internal/richtext.
    desc.innerHTML = e.body;
    card.append(desc);
  }
  if (e.link) {
    const a = el("a", "open-link", e.link);
    a.href = e.link; a.target = "_blank"; a.rel = "noreferrer";
    card.append(a);
  }

  // The plain-words version, when one has been published.
  if (e.explanation) {
    const plain = el("div", "plain");
    plain.append(el("div", "lead", "in plain words"));
    const d = el("div", "desc");
    d.innerHTML = e.explanation; // sanitized server-side, see internal/richtext
    plain.append(d);
    card.append(plain);
  }

  const send = (payload, button) => {
    for (const b of card.querySelectorAll("button")) b.disabled = true;
    fetch(`/v1/events/${e.id}/replies`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ author: "po" }, payload)),
    }).then(r => {
      if (!r.ok) throw new Error(r.status);
      toUndoStrip(e, payload.option || payload.text, Date.now() + undoWindow * 1000);
    }).catch(() => {
      for (const b of card.querySelectorAll("button")) b.disabled = false;
      if (!card.querySelector(".note")) {
        card.append(el("p", "note", "Sending failed. Your answer is still here — try again."));
      }
    });
  };

  if (e.options && e.options.length) {
    const box = el("div", "choices");
    for (const opt of e.options) {
      const b = el("button", null, opt);
      b.type = "button";
      b.addEventListener("click", () => send({ option: opt }));
      box.append(b);
    }
    card.append(box);
  }

  const free = el("div", "free");
  const input = el("input");
  input.type = "text";
  input.id = "free-" + e.id;
  const placeholder = e.kind === "validation" ? "Your verdict" : "Your answer";
  input.placeholder = placeholder;
  input.setAttribute("aria-label", placeholder);
  const ok = el("button", "send", "Reply");
  ok.type = "button";
  const submit = () => { if (input.value.trim()) send({ text: input.value.trim() }); };
  ok.addEventListener("click", submit);
  input.addEventListener("keydown", ev => { if (ev.key === "Enter") submit(); });
  free.append(input, ok);
  card.append(free);

  // Asking for a rewording is not answering, so it does not sit among the
  // answers: it is quieter, and below them. The card says the request was made
  // so the PO does not click again wondering whether the first one landed.
  if (e.explain_pending) {
    card.append(el("p", "asked", "Waiting for this to be put in plain words."));
  } else if (e.kind !== "info") {
    const ask = el("button", "aside", e.explanation ? "Ask again in plainer words" : "Explain simply");
    ask.type = "button";
    ask.addEventListener("click", () => {
      ask.disabled = true;
      fetch(`/v1/events/${e.id}/explain`, { method: "POST" })
        .then(r => { if (!r.ok) throw new Error(r.status); tick(); })
        .catch(() => {
          ask.disabled = false;
          if (!card.querySelector(".note")) {
            card.append(el("p", "note", "Could not ask. Try again."));
          }
        });
    });
    card.append(ask);
  }
  return card;
}

// --- taking an answer back --------------------------------------------------

// toUndoStrip folds an answered card into a strip, in place. It keeps its slot
// until the window closes, so nothing below it moves while the PO decides.
function toUndoStrip(e, verdict, until) {
  const card = cards.get(e.id);
  if (!card) return;
  cards.delete(e.id);
  undoable.set(e.id, { el: card, until });

  card.className = "ask done";
  card.replaceChildren();
  const head = el("div", "ask-head");
  head.append(el("span", "role" + (e.role === "manager" ? " manager" : ""), e.role || "dev"));
  const name = nameBeside(e.role, e.author);
  if (name) head.append(el("span", "who", name));
  head.append(el("span", "kind", "answered"));
  card.append(head, el("h3", null, e.title));

  const row = el("div", "verdict");
  row.append(el("span", "given", verdict || "—"));
  const undo = el("button", null, "Undo");
  undo.type = "button";
  undo.addEventListener("click", () => {
    undo.disabled = true;
    fetch(`/v1/events/${e.id}/undo`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ author: "po" }),
    }).then(r => {
      if (!r.ok) throw new Error(r.status);
      card.remove();
      undoable.delete(e.id);
      tick();
    }).catch(() => {
      row.append(el("span", "left", "too late"));
    });
  });
  row.append(undo, el("span", "left", ""));
  card.append(row);
  refreshEmpty();
  // Straight away, not on the next tick: an empty countdown or a tab still
  // announcing the ask just answered would both be lies, briefly.
  countdowns();
  setTab(cards.size);
}

// countdowns keeps the remaining seconds honest with no network traffic, and
// clears a strip once its window has closed.
function countdowns() {
  const now = Date.now();
  for (const [id, strip] of undoable) {
    const left = Math.ceil((strip.until - now) / 1000);
    if (left <= 0) {
      strip.el.remove();
      undoable.delete(id);
      refreshEmpty();
      continue;
    }
    const label = strip.el.querySelector(".left");
    if (label && label.textContent !== `${left} s`) label.textContent = `${left} s`;
  }
}

// renderRecent rebuilds the strips after a reload: the server remembers what
// was just answered, so refreshing never costs the chance to undo.
function renderRecent(recent) {
  for (const e of recent) {
    if (undoable.has(e.id) || cards.has(e.id) || !e.reply) continue;
    const until = new Date(e.reply.created_at).getTime() + undoWindow * 1000;
    if (until <= Date.now()) continue;
    const card = el("article", "ask");
    card.dataset.id = e.id;
    cards.set(e.id, card);
    document.getElementById("asks").append(card);
    toUndoStrip(e, e.reply.option || e.reply.text, until);
  }
}

// explainState is what would make a card look different: a request recorded, or
// an explanation published.
function explainState(e) {
  return (e.explain_pending ? "1" : "0") + ":" + (e.explanation ? e.explanation.length : 0);
}

function renderAsks(items) {
  const box = document.getElementById("asks");
  const seen = new Set();
  for (const e of items) {
    seen.add(e.id);
    const known = cards.get(e.id);
    if (!known) {
      const card = buildCard(e);
      card.dataset.explained = explainState(e);
      cards.set(e.id, card);
      box.append(card);
    } else if (known.dataset.explained !== explainState(e)) {
      // The plain-words version arrived, or a request for one was recorded.
      // That is new content, so the card is rebuilt — but only then, and only
      // if nobody is typing into it.
      const input = known.querySelector("input");
      const typing = input && (input.value.trim() !== "" || document.activeElement === input);
      if (!typing) {
        const fresh = buildCard(e);
        fresh.dataset.explained = explainState(e);
        known.replaceWith(fresh);
        cards.set(e.id, fresh);
      }
    }
    // Otherwise a card is never rebuilt: whatever the PO typed stays.
  }
  for (const [id, card] of cards) {
    if (seen.has(id)) continue;
    const input = card.querySelector("input");
    const busy = input && (input.value.trim() !== "" || document.activeElement === input);
    if (!busy) { card.remove(); cards.delete(id); continue; }
    // The ask left the list while the PO was typing into it — answered by
    // somebody else, or withdrawn by its author. The page cannot tell which,
    // and says neither: it states what is certain, keeps what was typed, and
    // lets the PO close the card themselves.
    if (!card.querySelector(".note")) {
      for (const b of card.querySelectorAll("button")) b.disabled = true;
      const note = el("p", "note", "This is no longer waiting on you. ");
      const close = el("button", null, "Close");
      close.type = "button";
      close.disabled = false;
      close.addEventListener("click", () => { card.remove(); cards.delete(id); refreshEmpty(); });
      note.append(close);
      card.append(note);
    }
  }
  reorder(items);
  refreshEmpty();
}

function refreshEmpty() {
  document.getElementById("empty").hidden = cards.size !== 0 || undoable.size !== 0;
  document.getElementById("count").textContent = cards.size + undoable.size;
}

// reorder puts the DOM back in the server's order — oldest first — but only
// when nobody is typing: moving a focused field would drop the caret.
function reorder(items) {
  const box = document.getElementById("asks");
  const typing = [...cards.values()].some(c => {
    const i = c.querySelector("input");
    return i && (document.activeElement === i || i.value.trim() !== "");
  });
  if (typing) return;
  const wanted = items.map(e => cards.get(e.id)).filter(Boolean);
  const current = [...box.children].filter(c => cards.has(Number(c.dataset.id)));
  if (wanted.length === current.length && wanted.every((c, i) => c === current[i])) return;
  for (const c of wanted) box.append(c);
}

function renderInfos(infos) {
  const box = document.getElementById("infos");
  document.getElementById("infos-summary").textContent =
    infos.length ? `Info (${infos.length})` : "Info";
  const wanted = infos.map(i => String(i.id)).join(",");
  if (box.dataset.ids === wanted) return;
  box.dataset.ids = wanted;
  box.replaceChildren(...infos.map(i => el("li", null, `${i.author} — ${i.title}`)));
}

// --- polling ----------------------------------------------------------------

function setSync(text, down) {
  const c = document.getElementById("sync");
  c.textContent = text;
  c.classList.toggle("down", !!down);
}

async function tick() {
  try {
    const res = await fetch("/v1/po", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    if (typeof data.undo_window === "number" && data.undo_window > 0) {
      undoWindow = data.undo_window;
    }
    renderSessions(data.sessions);
    renderAsks(data.for_you);
    renderRecent(data.recent || []);
    renderInfos(data.infos);
    setTab(data.for_you.length);
    setSync("updated " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
  } catch {
    // An empty page and a dead service must not look alike.
    setSync("service unreachable", true);
  }
}

// The footer says which build is answering. Checked once on load and after a
// republish: if the service was upgraded under an open page, it says so rather
// than letting the PO act on a page that no longer matches.
let bootVersion = null;
async function health() {
  try {
    const res = await fetch("/v1/health", { cache: "no-store" });
    const h = await res.json();
    if (bootVersion === null) bootVersion = h.version;
    const foot = document.getElementById("foot");
    foot.replaceChildren(el("span", null, `switchboard ${h.version}`),
                         el("span", null, `schema ${h.schema}`));
    if (h.version !== bootVersion) {
      foot.append(el("span", "warn", "the service was updated — reload this page"));
    }
    if (!h.ok) {
      foot.append(el("span", "warn", `schema ${h.schema}, expected ${h.schema_target}`));
    }
  } catch {
    // The sync indicator already reports an unreachable service.
  }
}

tick();
health();
setInterval(tick, 3000);
setInterval(countdowns, 500);
setInterval(health, 30000);
</script>
</body>
</html>
