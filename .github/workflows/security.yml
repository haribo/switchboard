# Scans that must run where they cannot be skipped.
#
# A pre-commit hook is opt-in per clone and per machine, and nothing in the
# repository can prove it is active anywhere. These run on every push, for
# everyone, including a contributor who cloned this morning.
name: security

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    # A vulnerability can be published long after the code stopped changing.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks reads history: a secret is not undone by a later commit,
          # it stays in the history and has to be rotated.
          fetch-depth: 0
      # gitleaks is run directly rather than through its action: the action
      # derives a commit range from the event, and on a push whose range
      # reaches the root commit that range is invalid — it then scans nothing,
      # reports "no leaks found", and fails. A check that passes on an empty
      # scan is exactly the kind this rule exists to rule out.
      - name: Scan for secrets
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --verbose

  vulnerabilities:
    name: known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Scan Go dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
